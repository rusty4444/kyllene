name: Test APK for chat-opening fix

on:
  push:
    branches: [ci/apk-ed057cd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ed057cd558bdc01d7d130201af6d5a182078e5f4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jetbrains
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = ed057cd558bdc01d7d130201af6d5a182078e5f4
      - name: Core tests
        id: tests
        continue-on-error: true
        run: ./gradlew --no-daemon :shared:core:testAndroidHostTest
      - name: Build release-like side-by-side test APK
        run: ./gradlew --no-daemon :androidApp:assembleDev -PappVersion=0.17.0-fix-ed057cd
      - name: Check APK and record checksum
        run: |
          apk=androidApp/build/outputs/apk/dev/androidApp-dev.apk
          test -s "$apk"
          sha256sum "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kyllene-dev-ed057cd
          path: androidApp/build/outputs/apk/dev/androidApp-dev.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-tests-ed057cd
          path: |
            shared/core/build/reports/tests/
            shared/core/build/test-results/
          if-no-files-found: ignore
      - name: Report test failures
        if: steps.tests.outcome == 'failure'
        run: exit 1
